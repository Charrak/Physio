name: Build RehaSport Check APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web-Dateien und Offline-Bibliotheken zusammenstellen
        run: |
          set -e
          test -f rehasport_check.html || (echo "rehasport_check.html fehlt im Repository" && exit 1)
          mkdir -p build/www/libs/core build/www/libs/lang
          cp rehasport_check.html build/www/index.html
          cp rehasport_icd_rules.json build/www/ || true
          cd build
          npm init -y > /dev/null
          npm install --no-audit --no-fund tesseract.js@5 tesseract.js-core@5 @zxing/library@0.21.3 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp node_modules/tesseract.js/dist/tesseract.min.js www/libs/
          cp node_modules/tesseract.js/dist/worker.min.js www/libs/
          cp node_modules/@zxing/library/umd/index.min.js www/libs/zxing.min.js
          cp node_modules/tesseract.js-core/tesseract-core-lstm.wasm* www/libs/core/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm* www/libs/core/
          for l in deu eng; do
            curl -fsSL -o www/libs/lang/$l.traineddata "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata"
            gzip -9 www/libs/lang/$l.traineddata
          done
          ls -la www/libs www/libs/core www/libs/lang

      - name: Android-Projekt erzeugen
        working-directory: build
        run: |
          set -e
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "de.charrak.rehasportcheck",
            "appName": "RehaSport Check",
            "webDir": "www",
            "backgroundColor": "#eef3f9"
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Kamera-Berechtigung, Icon und feste Signatur
        working-directory: build
        run: |
          set -e
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          extra = '    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          if "android.permission.CAMERA" not in s:
              s = s.replace("</manifest>", extra + "</manifest>")
          s = s.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          open(p, "w", encoding="utf-8").write(s)
          PY
          pip install --quiet pillow
          cat > icon_gen.py <<'PY'
          import math, os, sys
          from PIL import Image, ImageDraw
          S = 1024
          def heart_points(cx, cy, size, n=240):
              pts = []
              for i in range(n):
                  t = 2 * math.pi * i / n
                  x = 16 * math.sin(t) ** 3
                  y = 13 * math.cos(t) - 5 * math.cos(2 * t) - 2 * math.cos(3 * t) - math.cos(4 * t)
                  pts.append((cx + x * size / 34, cy - y * size / 34))
              return pts
          def glyph(size):
              big = Image.new("RGBA", (size * 2, size * 2), (0, 0, 0, 0))
              d = ImageDraw.Draw(big)
              d.polygon(heart_points(size, size * 1.06, size * 2 * 0.92), fill=(255, 255, 255, 255))
              ln = [(0.24, 0.50), (0.38, 0.50), (0.45, 0.36), (0.55, 0.66), (0.62, 0.50), (0.76, 0.50)]
              pts = [(x * size * 2, y * size * 2) for x, y in ln]
              d.line(pts, fill=(37, 99, 235, 255), width=int(size * 0.07), joint="curve")
              return big.resize((size, size), Image.LANCZOS)
          def full_icon(size):
              bg = Image.new("RGBA", (size, size), (37, 99, 235, 255))
              g = glyph(int(size * 0.62))
              bg.alpha_composite(g, ((size - g.width) // 2, (size - g.height) // 2))
              return bg
          def fg_icon(size):
              fg = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              g = glyph(int(size * 0.50))
              fg.alpha_composite(g, ((size - g.width) // 2, (size - g.height) // 2))
              return fg
          def round_icon(size):
              ic = full_icon(size)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(ic, (0, 0), mask)
              return out
          if __name__ == "__main__":
              res = sys.argv[1] if len(sys.argv) > 1 else "/tmp/res"
              for name, px, fpx in [("mdpi", 48, 108), ("hdpi", 72, 162), ("xhdpi", 96, 216), ("xxhdpi", 144, 324), ("xxxhdpi", 192, 432)]:
                  d = os.path.join(res, "mipmap-" + name)
                  os.makedirs(d, exist_ok=True)
                  full_icon(px).save(os.path.join(d, "ic_launcher.png"))
                  round_icon(px).save(os.path.join(d, "ic_launcher_round.png"))
                  fg_icon(fpx).save(os.path.join(d, "ic_launcher_foreground.png"))

          PY
          python3 icon_gen.py android/app/src/main/res
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#2563EB</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: APK bauen
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RehaSport-Check-APK
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
